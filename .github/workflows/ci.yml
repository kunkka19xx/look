name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

# Cancel any prior in-progress run for the same branch / PR when a new
# push comes in. Stops the slow linows build from keeping a stale
# commit's lane busy after you've already force-pushed an update.
concurrency:
  group: ci-${{ github.ref }}
  # PRs: supersede the stale run. Pushes to main: never cancel, or a quick
  # second merge leaves the first commit with no CI result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift == 'true' || github.event_name == 'workflow_dispatch' }}
      rust: ${{ steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
      release_macos: ${{ steps.filter.outputs.release_macos == 'true' || github.event_name == 'workflow_dispatch' }}
      linows: ${{ steps.filter.outputs.linows == 'true' || github.event_name == 'workflow_dispatch' }}
      linows_linux: ${{ steps.filter.outputs.linows_linux == 'true' || github.event_name == 'workflow_dispatch' }}
      linows_windows: ${{ steps.filter.outputs.linows_windows == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            swift:
              - 'apps/macos/**'
              - 'bridge/ffi/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'core/**'
              - 'bridge/ffi/**'
              - '.github/workflows/ci.yml'
            # The release path, not the app source. CI otherwise only ever
            # builds Debug, so ARCHS pinning and release stripping would be
            # unexercised until a real tag.
            release_macos:
              - 'scripts/release-arch.sh'
              - 'scripts/release-macos-app.sh'
              - 'scripts/build-release.sh'
              - 'apps/macos/LauncherApp/build-rust-ffi.sh'
              - 'apps/macos/LauncherApp/look-app.xcodeproj/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-release-macos.yml'
            linows:
              - 'apps/linows/**'
              - 'core/**'
            # NOTE: dorny/paths-filter matches each changed file against the rule
            # list with OR semantics, and a leading "!" is a picomatch negation
            # that matches every file *outside* that path - so an excluded-subdir
            # line like "!.../platform/windows/**" matched virtually any change
            # (macOS code, docs, README), firing these builds on unrelated PRs.
            # There's no AND across rules to express "linows changes except subdir
            # X", so we just trigger on any apps/linows or core change.
            linows_linux:
              - 'apps/linows/**'
              - 'core/**'
            linows_windows:
              - 'apps/linows/**'
              - 'core/**'

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Check formatting (core workspace)
        run: cargo fmt --all --manifest-path core/Cargo.toml -- --check

      - name: Check formatting (ffi crate)
        run: cargo fmt --all --manifest-path bridge/ffi/Cargo.toml -- --check

      - name: Run clippy (core workspace)
        run: cargo clippy --workspace --all-targets --manifest-path core/Cargo.toml -- -D warnings

      - name: Run clippy (ffi crate)
        run: cargo clippy --all-targets --manifest-path bridge/ffi/Cargo.toml -- -D warnings

  security:
    name: security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.linows == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies (core workspace)
        run: cargo audit --file core/Cargo.lock

      - name: Audit dependencies (ffi crate)
        run: cargo audit --file bridge/ffi/Cargo.lock

      - name: Audit dependencies (linows/tauri)
        # RUSTSEC-2026-0194/-0195 (quick-xml <0.41) still enter via
        # wayland-scanner, a build-time proc-macro that parses trusted local
        # protocol XML (no runtime attack surface). wayland-rs has no release
        # or master commit on quick-xml >=0.41 yet. The runtime-exposed path
        # (tauri -> plist) is fixed by bumping plist to 1.10 (quick-xml 0.41)
        # in the lockfile.
        # Drop these ignores once wayland-rs moves to quick-xml >=0.41.
        run: >
          cargo audit --file apps/linows/src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Run tests (core workspace)
        run: cargo test --workspace --manifest-path core/Cargo.toml

      - name: Run tests (ffi crate)
        run: cargo test --manifest-path bridge/ffi/Cargo.toml

  rust-platform-check:
    name: rust-platform-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Test (core workspace)
        run: cargo test --workspace --manifest-path core/Cargo.toml

      - name: Test (ffi crate)
        run: cargo test --manifest-path bridge/ffi/Cargo.toml

      # cargo check is enough: Release smoke does the real cross build and links
      # an app from it. This only has to catch source that cannot compile for
      # the Intel slice.
      - name: Check x86_64-apple-darwin slice (cross)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add x86_64-apple-darwin --toolchain nightly
          cargo +nightly check --target x86_64-apple-darwin --workspace --manifest-path core/Cargo.toml
          cargo +nightly check --target x86_64-apple-darwin --manifest-path bridge/ffi/Cargo.toml

  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Build (core workspace)
        run: cargo build --release --workspace --manifest-path core/Cargo.toml

      - name: Build (ffi crate)
        run: cargo build --release --manifest-path bridge/ffi/Cargo.toml

  macos-build:
    name: Build macOS App
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    env:
      # Pin to Xcode 26.3 - the runner default is 16.4, whose Swift 6
      # diagnostics are stricter than current dev machines and produce
      # spurious failures. Match the toolchain we actually develop on.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Swift unit tests
        run: swift test --package-path apps/macos/LauncherApp

      - name: Build Look app (Debug)
        run: xcodebuild -project "apps/macos/LauncherApp/look-app.xcodeproj" -scheme "Look" -configuration Debug -destination "platform=macOS" build

  macos-release-smoke:
    name: Release smoke (${{ matrix.arch }})
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.release_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            suffix: ""
          - arch: x86_64
            suffix: "-x86_64"
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust (nightly, ${{ matrix.arch }} slice)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      # Ad-hoc signed (CODE_SIGN_IDENTITY = -), so this needs no secrets. The
      # release workflow re-signs with the Developer ID on top.
      - name: Build release artifact
        run: ARCHS=${{ matrix.arch }} ./scripts/build-release.sh 0.0.0-ci

      - name: Assert one slice, stripped, packaged
        run: |
          APP=".build/release-macos/DerivedData/Build/Products/Release/Look.app/Contents/MacOS/Look"
          ZIP="dist/Look-0.0.0-ci-macOS${{ matrix.suffix }}.zip"

          archs="$(lipo -archs "$APP")"
          if [[ "$archs" != "${{ matrix.arch }}" ]]; then
            echo "expected a ${{ matrix.arch }} binary, got: $archs" >&2
            exit 1
          fi

          # Unstripped this carries ~147k symbols from the Rust staticlib, and
          # STRIP_STYLE = all takes it to a couple of thousand.
          symbols="$(nm -a "$APP" 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$symbols" -gt 20000 ]]; then
            echo "binary looks unstripped: $symbols symbols" >&2
            exit 1
          fi

          if [[ ! -f "$ZIP" ]]; then
            echo "missing artifact: $ZIP" >&2
            ls -la dist/ >&2
            exit 1
          fi

          codesign --verify --deep "$APP"
          echo "$archs, $symbols symbols, $(stat -f%z "$ZIP") byte zip"

  linows-js-test:
    name: Test linows (JS)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.linows == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        run: find apps/linows/src/js apps/linows/tests -name "*.js" -exec node --check {} +

      - name: Run tests
        run: node --test apps/linows/tests/*.test.js

  linows-build:
    name: Build linows (Tauri, Linux)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.linows_linux == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libharfbuzz-dev libdbus-1-dev \
            libasound2-dev librsvg2-dev libssl-dev \
            libappindicator3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            apps/linows/src-tauri

      - name: Check formatting
        run: cargo fmt --all --manifest-path apps/linows/src-tauri/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --locked --manifest-path apps/linows/src-tauri/Cargo.toml -- -D warnings

      - name: Build (debug)
        run: cargo build --locked --manifest-path apps/linows/src-tauri/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path apps/linows/src-tauri/Cargo.toml

  linows-build-windows:
    name: Build linows (Tauri, Windows)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.linows_windows == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # On windows-2025-vs2026, the rust-cache post-step's `tar` call hangs/
      # crashes when archiving the full `target/` dir (no error surfaced, job
      # ends FAILURE even though the build itself passes). Skipping target
      # caching keeps registry/git caching - the win that matters for cargo
      # fetch - while sidestepping the tar issue. Target rebuild on Windows
      # in this job is ~2 min, acceptable.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linows/src-tauri
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all --manifest-path apps/linows/src-tauri/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --locked --manifest-path apps/linows/src-tauri/Cargo.toml -- -D warnings

      - name: Build (debug)
        run: cargo build --locked --manifest-path apps/linows/src-tauri/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path apps/linows/src-tauri/Cargo.toml
