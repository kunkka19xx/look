name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any prior in-progress run for the same branch / PR when a new
# push comes in. Stops the slow linows build from keeping a stale
# commit's lane busy after you've already force-pushed an update.
concurrency:
  group: ci-${{ github.ref }}
  # PRs: supersede the stale run. Pushes to main: never cancel, or a quick
  # second merge leaves the first commit with no CI result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      rust: ${{ steps.filter.outputs.rust }}
      release_macos: ${{ steps.filter.outputs.release_macos }}
      linows: ${{ steps.filter.outputs.linows }}
      linows_linux: ${{ steps.filter.outputs.linows_linux }}
      linows_windows: ${{ steps.filter.outputs.linows_windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            swift:
              - 'apps/macos/**'
              - 'bridge/ffi/**'
            rust:
              - 'core/**'
              - 'bridge/ffi/**'
              - '.github/workflows/ci.yml'
            # The release path, not the app source. CI otherwise only ever
            # builds Debug, so ARCHS pinning and release stripping would be
            # unexercised until a real tag.
            release_macos:
              - 'scripts/release-arch.sh'
              - 'scripts/release-macos-app.sh'
              - 'scripts/build-release.sh'
              - 'apps/macos/build-rust-ffi.sh'
              - 'apps/macos/look-app.xcodeproj/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-release-macos.yml'
            # "!(*.md)" is an extglob inside ONE pattern - every file under
            # apps/linows/ that is not markdown - so editing README.md or
            # BUILDING.md no longer fires these builds.
            #
            # A separate "!..." LINE would not work: rules are OR-ed, and a
            # leading "!" is a picomatch negation matching every file *outside*
            # that path, which is how an excluded-subdir line once fired these
            # builds on macOS-only and docs-only PRs.
            linows:
              - 'apps/linows/**/!(*.md)'
              - 'core/**'
            linows_linux:
              - 'apps/linows/**/!(*.md)'
              - 'core/**'
            linows_windows:
              - 'apps/linows/**/!(*.md)'
              - 'core/**'

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Check core dependency direction
        run: ./scripts/check-core-deps.sh

      - name: Check formatting (core workspace)
        run: cargo fmt --all --manifest-path core/Cargo.toml -- --check

      - name: Check formatting (ffi crate)
        run: cargo fmt --all --manifest-path bridge/ffi/Cargo.toml -- --check

      - name: Run clippy (core workspace)
        run: cargo clippy --workspace --manifest-path core/Cargo.toml -- -D warnings

      - name: Run clippy (ffi crate)
        run: cargo clippy --manifest-path bridge/ffi/Cargo.toml -- -D warnings

  security:
    name: security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.linows == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies (core workspace)
        working-directory: core
        run: cargo audit

      - name: Audit dependencies (ffi crate)
        working-directory: bridge/ffi
        run: cargo audit

      - name: Audit dependencies (linows)
        # Ignores live in apps/linows/.cargo/audit.toml, shared with `make audit`.
        working-directory: apps/linows
        run: cargo audit

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Run tests (core workspace)
        run: cargo test --workspace --manifest-path core/Cargo.toml

      - name: Run tests (ffi crate)
        run: cargo test --manifest-path bridge/ffi/Cargo.toml

  rust-platform-check:
    name: rust-platform-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Test (core workspace)
        run: cargo test --workspace --manifest-path core/Cargo.toml

      - name: Test (ffi crate)
        run: cargo test --manifest-path bridge/ffi/Cargo.toml

      # cargo check is enough: Release smoke does the real cross build and links
      # an app from it. This only has to catch source that cannot compile for
      # the Intel slice.
      - name: Check x86_64-apple-darwin slice (cross)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add x86_64-apple-darwin --toolchain nightly
          cargo +nightly check --target x86_64-apple-darwin --workspace --manifest-path core/Cargo.toml
          cargo +nightly check --target x86_64-apple-darwin --manifest-path bridge/ffi/Cargo.toml

  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref == 'main')
      )
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      - name: Build (core workspace)
        run: cargo build --release --workspace --manifest-path core/Cargo.toml

      - name: Build (ffi crate)
        run: cargo build --release --manifest-path bridge/ffi/Cargo.toml

  macos-build:
    name: Build macOS App
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.swift == 'true'
    env:
      # Pin to Xcode 26.3 - the runner default is 16.4, whose Swift 6
      # diagnostics are stricter than current dev machines and produce
      # spurious failures. Match the toolchain we actually develop on.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Look app (Debug)
        run: xcodebuild -project "apps/macos/look-app.xcodeproj" -scheme "Look" -configuration Debug -destination "platform=macOS" build

  macos-release-smoke:
    name: Release smoke (${{ matrix.arch }})
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.release_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            suffix: ""
          - arch: x86_64
            suffix: "-x86_64"
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust (nightly, ${{ matrix.arch }} slice)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # There is no root Cargo.toml, so the default `workspaces: "."` caches
          # nothing and every run recompiles from scratch.
          workspaces: |
            core
            bridge/ffi

      # Ad-hoc signed (CODE_SIGN_IDENTITY = -), so this needs no secrets. The
      # release workflow re-signs with the Developer ID on top.
      - name: Build release artifact
        run: ARCHS=${{ matrix.arch }} ./scripts/build-release.sh 0.0.0-ci

      - name: Assert one slice, stripped, packaged
        run: |
          APP=".build/release-macos/DerivedData/Build/Products/Release/Look.app/Contents/MacOS/Look"
          ZIP="dist/Look-0.0.0-ci-macOS${{ matrix.suffix }}.zip"

          archs="$(lipo -archs "$APP")"
          if [[ "$archs" != "${{ matrix.arch }}" ]]; then
            echo "expected a ${{ matrix.arch }} binary, got: $archs" >&2
            exit 1
          fi

          # Unstripped this carries ~147k symbols from the Rust staticlib, and
          # STRIP_STYLE = all takes it to a couple of thousand.
          symbols="$(nm -a "$APP" 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$symbols" -gt 20000 ]]; then
            echo "binary looks unstripped: $symbols symbols" >&2
            exit 1
          fi

          if [[ ! -f "$ZIP" ]]; then
            echo "missing artifact: $ZIP" >&2
            ls -la dist/ >&2
            exit 1
          fi

          codesign --verify --deep "$APP"
          echo "$archs, $symbols symbols, $(stat -f%z "$ZIP") byte zip"

  linows-build:
    name: Build linows (Linux)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.linows_linux == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libwayland-dev libasound2-dev libdbus-1-dev libssl-dev \
            libfontconfig1-dev libfreetype-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            core
            apps/linows

      - name: Check formatting
        run: cargo fmt --all --manifest-path apps/linows/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --manifest-path apps/linows/Cargo.toml -- -D warnings

      - name: Build (debug)
        run: cargo build --locked --manifest-path apps/linows/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path apps/linows/Cargo.toml

      - name: Smoke the binary
        run: apps/linows/target/debug/lookapp --version

  linows-build-windows:
    name: Build linows (Windows)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.linows_windows == 'true'
    env:
      # Nothing here reads a PDB, and MSVC spends minutes writing them.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Target caching was off here from May 2026 after the post-step tar
      # hung on the windows-2025-vs2026 image. The cold rebuild has grown
      # from 2 to 13 minutes since gpui, so it is back on; if the hang
      # returns, sccache is the next thing to try, not cache-targets: false.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: apps/linows

      - name: Check formatting
        run: cargo fmt --all --manifest-path apps/linows/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --manifest-path apps/linows/Cargo.toml -- -D warnings

      - name: Build (debug)
        run: cargo build --locked --manifest-path apps/linows/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path apps/linows/Cargo.toml
