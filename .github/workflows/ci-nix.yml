name: CI Nix Build

on:
  pull_request:
    paths:
      - "core/**"
      - "apps/linows/gpui/**"
      - "apps/linows/icons/**"
      - "apps/linows/packaging/**"
      - "apps/linows/backend/**"
      - "apps/linows/Cargo.*"
      - "apps/linows/nix/**"
      - "apps/linows/flake.nix"
      - "apps/linows/flake.lock"
      # Last match wins in GitHub's own path filter, so this trailing negation
      # drops a docs-only edit. Note it is NOT the syntax ci.yml uses: that one
      # filters with dorny/paths-filter, where rules are OR-ed instead.
      - "!apps/linows/**.md"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "apps/linows/gpui/**"
      - "apps/linows/icons/**"
      - "apps/linows/packaging/**"
      - "apps/linows/backend/**"
      - "apps/linows/Cargo.*"
      - "apps/linows/nix/**"
      - "apps/linows/flake.nix"
      - "apps/linows/flake.lock"
      # Last match wins in GitHub's own path filter, so this trailing negation
      # drops a docs-only edit. Note it is NOT the syntax ci.yml uses: that one
      # filters with dorny/paths-filter, where rules are OR-ed instead.
      - "!apps/linows/**.md"

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Pushes populate the cache so later runs reuse the dependency closure
      # instead of recompiling it. Fork PRs cannot read secrets, so the token
      # is empty there and the action falls back to read-only automatically.
      - uses: cachix/cachix-action@v17
        with:
          name: look
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `nix build .#default` never touches the module outputs, so a broken
      # NixOS or Home Manager module would only surface in a user's rebuild.
      - name: Evaluate flake modules
        run: |
          nix eval ./apps/linows#nixosModules.default --apply builtins.isFunction
          nix eval ./apps/linows#homeModules.default --apply builtins.isFunction

      # -L streams the derivation's build log. Without it nix buffers the whole
      # compile into one silent block, which makes a slow or stuck build
      # impossible to diagnose from the Actions log.
      - name: Build
        run: nix build ./apps/linows#default -L

      - name: Verify version
        run: ./result/bin/lookapp --version

  # The macOS package installs the signed release bundle instead of building
  # it (apps/linows/nix/package-darwin.nix), so what can go wrong is a stale
  # hash after a release and a bundle that no longer passes Gatekeeper once
  # it has been through the store. Both are checked here; nothing is compiled.
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build
        run: nix build ./apps/linows#packages.aarch64-darwin.default -L

      - name: Verify the bundle
        run: |
          set -euo pipefail
          # Headless-safe: the app is an LSUIElement bundle, so read the
          # version off the plist rather than launching it.
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            result/Applications/Look.app/Contents/Info.plist)"
          echo "Look.app reports $version"
          test "$version" = "$(nix eval --raw ./apps/linows#packages.aarch64-darwin.default.version)"
          codesign --verify --deep --strict --verbose=2 result/Applications/Look.app
          spctl -a -vvv -t exec result/Applications/Look.app
          test -x result/bin/lookapp
