name: Release macOS App

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        type: string
      attach_release:
        description: "Attach and publish to GitHub Release"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  build-release:
    uses: ./.github/workflows/reusable-release-macos.yml
    with:
      release_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      trigger_event: ${{ github.event_name }}
      attach_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.attach_release) }}
      concurrency_ref: ${{ github.ref }}
    secrets: inherit
