name: Unpick closed issues

on:
  issues:
    types: [closed]

# Only touches labels, nothing else.
permissions:
  issues: write

jobs:
  remove-picked:
    # Skip the API call entirely when the label was never on the issue.
    if: contains(github.event.issue.labels.*.name, 'picked')
    runs-on: ubuntu-latest
    steps:
      - name: Remove the picked label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label picked
