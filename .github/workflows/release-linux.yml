name: Release Linux App

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Linux release artifacts
    runs-on: ubuntu-22.04
    concurrency:
      group: release-linux-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The tag is the version: it is baked into the binary (LOOK_VERSION, see
      # backend/build.rs) and the packages. The workspace version only serves
      # dev and Nix builds, so a lag there is a warning, not a failure.
      - name: Compare with the workspace version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          WS_VERSION=$(grep -A1 '^\[workspace.package\]' apps/linows/Cargo.toml | grep version | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$VERSION" != "$WS_VERSION" ]]; then
            echo "::warning::Tag is $VERSION but apps/linows/Cargo.toml says $WS_VERSION; Nix builds report the latter until it is bumped."
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libwayland-dev libasound2-dev libdbus-1-dev libssl-dev \
            libfontconfig1-dev libfreetype-dev pkg-config file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            core
            apps/linows

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build
        working-directory: apps/linows
        env:
          LOOK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release --locked -p lookapp
          test "$(target/release/lookapp --version)" = "lookapp $LOOK_VERSION"

      # Built on ubuntu-22.04 so the glibc floor and the $auto depends stay
      # the oldest supported release.
      - name: Package .deb
        working-directory: apps/linows
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p ../../dist
          cargo deb -p lookapp --no-build --deb-version "$VERSION" \
            -o "../../dist/Look_${VERSION}_amd64.deb"

      - name: Package AppImage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/linux/make-appimage.sh apps/linows/target/release/lookapp "$VERSION" \
            "dist/Look_${VERSION}_amd64.AppImage"

      - name: Checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist && sha256sum * > "Look-${VERSION}-linux-checksums.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: look-linux-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  nix-build:
    name: Build and push Nix package to Cachix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - uses: cachix/cachix-action@v17
        with:
          name: look
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build ./apps/linows#default

      - name: Verify version
        run: ./result/bin/lookapp --version

  publish-aur:
    name: Publish look-bin to AUR
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download .deb and compute checksum
        id: artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fSL -o "Look_${VERSION}_amd64.deb" \
            "https://github.com/kunkka19xx/look/releases/download/v${VERSION}/Look_${VERSION}_amd64.deb"
          SHA256=$(sha256sum "Look_${VERSION}_amd64.deb" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Template PKGBUILD
        run: |
          mkdir -p aur-staging
          sed \
            -e "s/__VERSION__/${{ steps.version.outputs.version }}/g" \
            -e "s/__SHA256__/${{ steps.artifact.outputs.sha256 }}/g" \
            packaging/aur/PKGBUILD > aur-staging/PKGBUILD

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        run: |
          # Setup SSH
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          echo "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/aur -o StrictHostKeyChecking=accept-new"
          git config --global safe.directory '*'

          # Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/look-bin.git /tmp/aur-repo
          cp aur-staging/PKGBUILD /tmp/aur-repo/PKGBUILD

          # Generate .SRCINFO (makepkg can't run as root)
          useradd -m builder
          chown -R builder:builder /tmp/aur-repo
          su builder -c 'cd /tmp/aur-repo && makepkg --printsrcinfo > .SRCINFO'

          # Commit and push
          cd /tmp/aur-repo
          git config user.name "$AUR_USERNAME"
          git config user.email "nobita079x@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ steps.version.outputs.version }}"
          git push
