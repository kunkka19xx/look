name: Update nixpkgs

# A stale pin builds Look against an older glibc than the user's NixOS graphics
# driver, and WebKit then fails with EGL_BAD_PARAMETER (blank window).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-nixpkgs
  cancel-in-progress: true

env:
  BRANCH: chore/update-nixpkgs

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Don't leave a token in .git/config for the third-party steps below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update the lock
        working-directory: apps/linows
        run: nix flake update nixpkgs

      # A PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN never trigger CI,
      # so the required checks would never run.
      - name: Open or refresh the PR
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FLAKE_UPDATE_TOKEN is not set (PAT with repo scope)."
            exit 1
          fi
          if git diff --quiet -- apps/linows/flake.lock; then
            echo "nixpkgs already current."
            exit 0
          fi
          rev=$(jq -r .nodes.nixpkgs.locked.rev apps/linows/flake.lock)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "chore(nix): update nixpkgs to ${rev:0:12}"
          gh auth setup-git
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore(nix): update nixpkgs" \
              --body "Weekly bump of \`apps/linows/flake.lock\` nixpkgs so Cachix builds match current NixOS."
          fi
