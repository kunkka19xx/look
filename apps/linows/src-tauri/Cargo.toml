[package]
name = "lookapp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["kunkka19xx <nobita079x@gmail.com>"]

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
linows-backend = { path = "../backend" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The KWin blur atom on X11.
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
# Window/display pointers for the Wayland blur bind, without GDK FFI.
raw-window-handle = "0.6"
webkit2gtk = "2.0"
# dlopen for libgtk-layer-shell: absent on some distros, so it must not be a
# link-time dependency.
libloading = "0.8"
# Owning the clipboard in-process, which is the only way to offer a path as
# BOTH a file (for a file manager) and text (for everything else): wl-copy and
# xclip each advertise a single MIME type per invocation. Pinned to the version
# WebKitGTK already pulls in, so this adds no new build.
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
