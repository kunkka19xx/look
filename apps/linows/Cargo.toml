[workspace]
resolver = "3"
members = ["backend", "gpui", "src-tauri"]
# What a bare `cargo build` builds: the shipping shell and its backend. The
# gpui port links wgpu and xkbcommon, which the Tauri dev shell and CI do not
# carry yet, so it is built by name: `cargo build -p look-gpui`.
default-members = ["backend", "src-tauri"]

[profile.release]
strip = true
lto = true

# The gpui shell: a third smaller for size over speed in the code that is
# not the renderer. Its own profile, so the Tauri build keeps the default.
[profile.release-gpui]
inherits = "release"
opt-level = "s"
codegen-units = 1

# Unoptimised, decoding a background photo took seconds in a dev build.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
