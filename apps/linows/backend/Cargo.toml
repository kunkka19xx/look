[package]
name = "linows-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["kunkka19xx <nobita079x@gmail.com>"]
description = "Everything the linows launcher does that is not drawing: search, launching, clipboard, controls. Shared by the Tauri shell and the gpui port."

[lib]
name = "linows_backend"
path = "src/lib.rs"

[dependencies]
look-answers = { path = "../../../core/answers" }
look-calc = { path = "../../../core/calc" }
look-engine = { path = "../../../core/engine" }
look-lunar = { path = "../../../core/lunar" }
look-matching = { path = "../../../core/matching" }
look-netspeed = { path = "../../../core/netspeed" }
look-qactions = { path = "../../../core/qactions" }
look-sources = { path = "../../../core/sources" }
look-storage = { path = "../../../core/storage" }
look-todo = { path = "../../../core/todo" }
look-tools = { path = "../../../core/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
open = "5"
base64 = "0.22"
rodio = "0.20"
arboard = { version = "3", features = ["wayland-data-control"] }
dirs = "6"
# PNG for the ci" image clipboard (encode a capture, decode it to paste) and
# for Windows icon conversion.
png = "0.17"
trash = "5"
tokio = { version = "1.52.3", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# xtest: typing the paste chord into another window, the X11 half of Ctrl+I.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xtest"] }
zbus = "5"
# StreamExt for zbus signal streams.
futures-util = { version = "0.3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
# "system" pins the libwayland backend: blur binds against the shell's own
# wl_display, which only the sys backend can adopt.
wayland-client = { version = "0.31", features = ["system"], default-features = false }
wayland-protocols-wlr = { version = "0.3", features = ["client"], default-features = false }
# One copy offered in several types (pixels, files, path) without a focused
# surface, over data-control. Already in the tree through arboard.
wl-clipboard-rs = "0.9"
# Behind-window blur: the cross-desktop staging protocol (KWin 6.7+, Hyprland
# 0.56+, Niri; Mutter in review) plus KDE's own, which Plasma used until 6.7.
# Unstable for xdg-output, the monitor's logical size.
wayland-protocols = { version = "0.32", features = [
    "client",
    "staging",
    "unstable",
], default-features = false }
wayland-protocols-plasma = { version = "0.3", features = [
    "client",
], default-features = false }
# zwp_virtual_keyboard_v1: the Wayland half of Ctrl+I. Every compositor but
# Mutter offers it; GNOME goes through Look's own shell extension instead.
wayland-protocols-misc = { version = "0.3", features = [
    "client",
], default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    # NtQueryInformationProcess: the only way to read another process's
    # command line without a cross-bitness PEB walk.
    "Wdk_System_Threading",
    "Foundation_Collections",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Media_Control",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
