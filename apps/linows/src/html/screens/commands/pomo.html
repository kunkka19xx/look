<div class="cmd-panel" id="cmd-panel-pomo" hidden>
  <!-- Header -->
  <div class="cmd-header-bar">
    <span class="cmd-input-bar-icon">&#x23F1;</span>
    <span class="cmd-subtitle" id="cmd-pomo-header">6 sessions planned</span>
    <span class="cmd-pill">/pomo</span>
  </div>

  <!-- Timer card -->
  <div class="cmd-pomo-card" id="cmd-pomo-card">
    <div class="cmd-pomo-session-name" id="cmd-pomo-session-name"></div>
    <div class="cmd-pomo-timer" id="cmd-pomo-timer">
      <canvas id="cmd-pomo-canvas" width="200" height="200"></canvas>
    </div>
  </div>

  <!-- Controls -->
  <div class="cmd-pomo-controls" id="cmd-pomo-controls">
    <button class="cmd-pomo-btn cmd-pomo-btn-toggle" id="cmd-pomo-toggle">Start</button>
    <button class="cmd-pomo-btn cmd-pomo-btn-skip" id="cmd-pomo-skip" hidden>Skip</button>
    <button class="cmd-pomo-btn cmd-pomo-btn-reset" id="cmd-pomo-reset" hidden>Reset (R)</button>
    <button class="cmd-pomo-btn cmd-pomo-btn-settings" id="cmd-pomo-settings-btn" title="Timer style">&#x2699;</button>
  </div>

  <!-- Settings panel (timer style picker) -->
  <div class="cmd-pomo-settings" id="cmd-pomo-settings" style="display:none">
    <span class="cmd-pomo-settings-label">Timer style:</span>
    <button class="cmd-pomo-style-btn" data-style="modern">Modern Ring</button>
    <button class="cmd-pomo-style-btn" data-style="vintage">Vintage Dial</button>
    <button class="cmd-pomo-style-btn" data-style="minimal">Minimal Text</button>
  </div>

  <!-- Session list -->
  <div class="cmd-pomo-sessions" id="cmd-pomo-sessions">
    <div class="cmd-pomo-sessions-header" id="cmd-pomo-sessions-toggle">
      <span class="cmd-pomo-chevron" id="cmd-pomo-chevron">&#x25B6;</span>
      <span>Sessions</span>
      <div class="cmd-pomo-sessions-actions" id="cmd-pomo-sessions-actions">
        <button class="cmd-pomo-add-btn" id="cmd-pomo-add-focus">+ Focus</button>
        <button class="cmd-pomo-add-btn" id="cmd-pomo-add-break">+ Break</button>
      </div>
    </div>
    <div class="cmd-pomo-sessions-list" id="cmd-pomo-sessions-list" style="display:none"></div>
  </div>
</div>
