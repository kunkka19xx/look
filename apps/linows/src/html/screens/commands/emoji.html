<div class="cmd-panel" id="cmd-panel-emoji" hidden>
    <div class="cmd-input-bar">
        <span class="cmd-input-bar-icon" id="cmd-emoji-header-icon"></span>
        <input
            id="cmd-emoji-input"
            type="text"
            placeholder="Search emoji by name"
            spellcheck="false"
            autocomplete="off"
        />
        <span class="cmd-pill">/emoji</span>
    </div>
    <div class="cmd-content">
        <div class="cmd-emoji-list" id="cmd-emoji-list" role="listbox"></div>
        <div class="cmd-feedback" id="cmd-emoji-feedback">Selected /emoji</div>
    </div>
</div>
