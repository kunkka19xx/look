[package]
name = "look-ffi"
edition = "2024"
# Let chains, stabilized in 1.88 (edition 2024 alone is not enough).
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["kunkka19xx <nobita079x@gmail.com>"]
version = "0.1.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
look-ai = { path = "../../core/ai" }
look-answers = { path = "../../core/answers" }
look-calc = { path = "../../core/calc" }
look-engine = { path = "../../core/engine" }
look-indexing = { path = "../../core/indexing" }
look-lunar = { path = "../../core/lunar" }
look-matching = { path = "../../core/matching" }
look-netspeed = { path = "../../core/netspeed" }
look-qactions = { path = "../../core/qactions" }
look-ranking = { path = "../../core/ranking" }
look-storage = { path = "../../core/storage" }
look-todo = { path = "../../core/todo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
